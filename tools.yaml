kind: source
name: pokeapi-source
type: http
baseUrl: ${POKEAPI_BASE_URL}
timeout: 15s
headers:
  Accept: application/json
  X-Custom-Token: demo-token
---
kind: tool
name: get_pokemon
type: http
source: pokeapi-source
method: GET
path: "pokemon/{{.name | pathEscape}}"
description: "Get details about a Pokémon by its name or ID (e.g., pikachu, charizard, 25)."
pathParams:
  - name: name
    type: string
    description: "The name or Pokedex ID of the Pokémon (lowercase)."
---
kind: tool
name: list_pokemon
type: http
source: pokeapi-source
method: GET
path: "pokemon"
description: "List Pokémon with pagination."
queryParams:
  - name: limit
    type: integer
    description: "Number of Pokémon to return."
    required: false
  - name: offset
    type: integer
    description: "Starting offset for pagination."
    required: false
---
kind: toolset
name: pokeapi_toolset
tools:
  - get_pokemon
  - list_pokemon