kind: source
name: dataplex-source
type: dataplex
project: ${DATAPLEX_PROJECT}
---
kind: tool
name: search_entries
type: dataplex-search-entries
source: dataplex-source
description: Searches for data assets (eg. table/dataset/view) in Catalog based on the provided search query.
---
kind: tool
name: lookup_entry
type: dataplex-lookup-entry
source: dataplex-source
description: Retrieves a specific metadata regarding a data asset (e.g. table/dataset/view) from Catalog
---
kind: tool
name: search_aspect_types
type: dataplex-search-aspect-types
source: dataplex-source
description: Search aspect types relevant to the query.
---
kind: tool
name: lookup_context
type: dataplex-lookup-context
source: dataplex-source
description: Retrieves rich metadata regarding one or more data assets along with their relationships.
---
kind: tool
name: search_dq_scans
type: dataplex-search-dq-scans
source: dataplex-source
description: Use this tool to search for data quality scans in Dataplex.
---
kind: tool
name: list_data_products
type: dataplex-list-data-products
source: dataplex-source
description: Lists Data Products across all locations.
---
kind: tool
name: get_data_product
type: dataplex-get-data-product
source: dataplex-source
description: Retrieves specific metadata regarding a Data Product.
---
kind: tool
name: list_data_assets
type: dataplex-list-data-assets
source: dataplex-source
description: Lists Data Assets under a Data Product.
---
kind: tool
name: get_data_asset
type: dataplex-get-data-asset
source: dataplex-source
description: Retrieves specific metadata regarding a Data Asset.
---
kind: tool
name: create_data_product
type: dataplex-create-data-product
source: dataplex-source
description: Creates a new Data Product.
---
kind: tool
name: update_data_product
type: dataplex-update-data-product
source: dataplex-source
description: Updates an existing Data Product.
---
kind: toolset
name: discovery
tools:
- search_entries
- lookup_entry
- search_aspect_types
- lookup_context
- search_dq_scans
- list_data_products
- get_data_product
- list_data_assets
- get_data_asset
- create_data_product
- update_data_product
