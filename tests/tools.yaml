kind: source
name: test-sqlite
type: sqlite
database: tests/test.db
---
kind: tool
name: test_simple_text
type: sqlite-sql
source: test-sqlite
description: Test simple text
statement: SELECT 'This is a simple text response for testing.' AS text;
