name: test_prompt_with_arguments
description: Test prompt with arguments
messages:
  - role: user
    content: "Prompt with arguments: arg1='{{.arg1}}', arg2='{{.arg2}}'"
arguments:
  - name: "arg1"
    description: "First test argument"
  - name: "arg2"
    description: "Second test argument"
