[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox-sdk-server"
dynamic = ["version"] # Version is set in src/toolbox_sdk_server/__init__.py
requires-python = ">=3.8"
description = "MCP Toolbox Server for Database Operations"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# This package wraps a Go binary, so it has no direct Python dependencies.
dependencies = []

[project.scripts]
toolbox-sdk-server = "toolbox_sdk_server.main:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["toolbox_sdk_server*"]

