# Shared by every database and harness: EVAL_DATASET selects the evalset,
# EVAL_MODEL_CONFIG the harness. Nothing else here is harness-specific, so a
# new harness needs a model config, not another run config.

dataset_config: !ENV ${EVAL_DATASET}
dataset_format: gemini-cli-format
orchestrator: agent

model_config: !ENV ${EVAL_MODEL_CONFIG}
simulated_user_model_config: evals/model_configs/gemini_3.1_pro_model.yaml

scorers:
  trajectory_matcher: {}
  goal_completion:
    model_config: evals/model_configs/gemini_3.1_pro_model.yaml
  behavioral_metrics:
    model_config: evals/model_configs/gemini_3.1_pro_model.yaml
  parameter_analysis:
    model_config: evals/model_configs/gemini_3.1_pro_model.yaml
  turn_count: {}
  agent_steps: {}
  end_to_end_latency: {}
  tool_call_latency: {}
  token_consumption: {}
  tokens_processed: {}
  effective_billed_tokens: {}

reporting:
  csv:
    output_directory: 'results'
  # bigquery:
  #   gcp_project_id: !ENV ${EVAL_GCP_PROJECT_ID}
